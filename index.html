<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#bfd7e5" />
    <meta name="description" content="Explore a handcrafted 360-degree miniature neighborhood store through changing light and weather." />
    <title>Moon Mart — Interactive Miniature</title>

    <style>:root {
  color-scheme: light;
  --sky: #bed7e5;
  --ink: #19273e;
  --cream: rgba(255, 253, 244, .9);
  --line: rgba(25, 39, 62, .13);
  --accent: #f05a65;
  --yellow: #ffd760;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body { margin: 0; min-width: 320px; overflow: hidden; background: var(--sky); color: var(--ink); font-family: Inter, ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif; }
button { font: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.viewer { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at 52% 44%, rgba(255,255,255,.25), transparent 38%), var(--sky); transition: background .8s ease; isolation: isolate; }
.viewer[data-time="dusk"] { background: radial-gradient(circle at 55% 44%, rgba(255,197,155,.26), transparent 38%), #9faec9; }
.viewer[data-time="night"] { background: radial-gradient(circle at 55% 44%, rgba(96,125,169,.24), transparent 38%), #243650; }
.viewer[data-weather="cloudy"][data-time="day"] { background: radial-gradient(circle at 52% 44%, rgba(255,255,255,.15), transparent 38%), #a9bdc8; }
#sceneCanvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; outline: none; }
#sceneCanvas:active { cursor: grabbing; }
.snow-overlay { position: absolute; z-index: 6; inset: -12vh 0 0; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity .55s ease; }
.viewer[data-weather="snow"] .snow-overlay { opacity: 1; }
.snow-flake { position: absolute; top: -12vh; left: var(--left); color: rgba(255,255,255,.98); font-size: var(--size); line-height: 1; text-shadow: 0 0 7px rgba(145,193,226,.95), 0 2px 3px rgba(70,102,128,.4); animation: snow-fall var(--duration) linear var(--delay) infinite; will-change: transform; }
@keyframes snow-fall {
  0% { transform: translate3d(0, -8vh, 0) rotate(0deg); }
  48% { transform: translate3d(calc(var(--drift) * .42), 60vh, 0) rotate(170deg); }
  100% { transform: translate3d(var(--drift), 124vh, 0) rotate(360deg); }
}
.topbar { position: absolute; z-index: 8; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: max(18px, env(safe-area-inset-top)) clamp(18px, 3vw, 44px) 12px; pointer-events: none; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 15px; color: #16263f; background: var(--yellow); box-shadow: 0 12px 30px rgba(39, 57, 80, .14); font-size: 29px; font-weight: 900; transform: rotate(-10deg); }
.brand strong { display: block; font-size: 16px; letter-spacing: .12em; }
.brand span:not(.brand-mark) { display: block; margin-top: 5px; color: rgba(25,39,62,.58); font-size: 10px; font-weight: 800; letter-spacing: .2em; }
[data-time="night"] .brand span:not(.brand-mark), [data-time="night"] .scene-index span { color: rgba(255,255,255,.55); }
[data-time="night"] .brand strong, [data-time="night"] .scene-index b { color: white; }
.gesture-hint { position: absolute; left: 50%; top: max(20px, env(safe-area-inset-top)); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 15px; border: 1px solid rgba(255,255,255,.46); border-radius: 999px; background: rgba(255,255,255,.48); backdrop-filter: blur(14px); color: rgba(25,39,62,.68); box-shadow: 0 10px 30px rgba(50, 73, 99, .1); font-size: 11px; letter-spacing: .08em; transition: opacity .35s ease, transform .35s ease; }
.gesture-hint.used { opacity: 0; transform: translate(-50%, -8px); }
.gesture-hint b { color: var(--ink); font-size: 11px; }
.gesture-hint i { width: 1px; height: 16px; background: var(--line); }
.drag-icon { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--yellow); color: var(--ink); font-size: 14px; }
.scene-index { text-align: right; }
.scene-index span { display: block; color: rgba(25,39,62,.55); font-size: 9px; font-weight: 900; letter-spacing: .18em; }
.scene-index b { display: block; margin-top: 2px; font-size: 22px; letter-spacing: -.03em; }
.zoom-controls { position: absolute; z-index: 8; right: clamp(18px, 3vw, 44px); top: 50%; transform: translateY(-50%); display: grid; gap: 8px; }
.zoom-controls button { width: 44px; height: 44px; border: 1px solid rgba(255,255,255,.7); border-radius: 15px; background: rgba(255,255,255,.7); color: var(--ink); box-shadow: 0 10px 28px rgba(39,57,80,.13); backdrop-filter: blur(12px); cursor: pointer; font-size: 24px; line-height: 1; transition: .18s ease; }
.zoom-controls button:hover { background: white; transform: translateY(-2px); }
.audio-control { position: absolute; z-index: 9; right: clamp(18px, 3vw, 44px); top: max(82px, calc(env(safe-area-inset-top) + 70px)); }
.audio-control button { width: 58px; height: 58px; padding: 7px 5px 6px; display: grid; place-items: center; gap: 1px; border: 1px solid rgba(255,255,255,.72); border-radius: 19px; background: rgba(255,255,255,.7); color: var(--ink); box-shadow: 0 10px 28px rgba(39,57,80,.13); backdrop-filter: blur(12px); cursor: pointer; transition: .2s ease; }
.audio-control button:hover { background: white; transform: translateY(-2px); }
.audio-control button[aria-pressed="true"] { background: var(--yellow); border-color: rgba(255,255,255,.8); box-shadow: 0 9px 24px rgba(183,137,25,.24); }
.audio-control button > span { font-size: 22px; line-height: 1; }
.audio-control button small { color: inherit; font-size: 8px; font-weight: 900; letter-spacing: .08em; }
[data-time="night"] .audio-control button:not([aria-pressed="true"]) { background: rgba(255,255,255,.78); }
.view-status { position: absolute; z-index: 8; left: clamp(18px, 3vw, 44px); top: 50%; transform: translateY(-50%) rotate(-90deg); transform-origin: left top; color: rgba(25,39,62,.48); font-size: 10px; font-weight: 900; letter-spacing: .18em; }
[data-time="night"] .view-status { color: rgba(255,255,255,.5); }
.control-dock { position: absolute; z-index: 10; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(94vw, 840px); padding: 10px 14px; display: flex; align-items: center; justify-content: center; gap: 12px; border: 1px solid rgba(255,255,255,.78); border-radius: 27px; background: var(--cream); backdrop-filter: blur(22px) saturate(1.2); box-shadow: 0 24px 55px rgba(41,61,86,.19); }
.dock-group { min-width: 0; display: flex; align-items: center; gap: 6px; }
.group-label { margin-right: 5px; color: #7b899a; font-size: 9px; font-weight: 950; letter-spacing: .17em; }
.dock-divider { flex: 0 0 1px; width: 1px; height: 48px; background: var(--line); }
.dock-button { min-width: 54px; min-height: 54px; padding: 6px 7px 5px; display: grid; place-items: center; gap: 1px; border: 0; border-radius: 17px; background: transparent; color: #66778d; cursor: pointer; transition: .18s ease; }
.dock-button > span { font-size: 21px; line-height: 1; }
.dock-button small { color: inherit; font-size: 8px; font-weight: 900; letter-spacing: .06em; }
.dock-button:hover { background: rgba(25,39,62,.06); transform: translateY(-2px); }
.dock-button.active, .dock-button[aria-pressed="true"] { background: var(--yellow); color: #26364d; box-shadow: 0 8px 18px rgba(183,137,25,.2); }
.loading-layer { position: absolute; z-index: 30; inset: 0; display: grid; place-content: center; place-items: center; gap: 18px; background: #bed7e5; color: var(--ink); transition: opacity .55s ease, visibility .55s ease; }
.loading-layer.ready { opacity: 0; visibility: hidden; }
.loading-layer b { font-size: 11px; letter-spacing: .2em; }
.loading-cube { width: 38px; height: 38px; border: 5px solid rgba(25,39,62,.15); border-top-color: var(--accent); border-radius: 12px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
noscript { position: fixed; z-index: 50; inset: 0; display: grid; place-items: center; background: white; color: var(--ink); font-size: 16px; }
@media (max-width: 760px) {
  .topbar { padding: max(12px, env(safe-area-inset-top)) 14px 8px; }
  .brand-mark { width: 36px; height: 36px; border-radius: 12px; font-size: 24px; }
  .brand strong { font-size: 13px; }
  .brand span:not(.brand-mark), .scene-index span { font-size: 8px; }
  .scene-index b { font-size: 18px; }
  .gesture-hint { top: auto; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 92px); padding: 8px 11px; }
  .gesture-hint span:last-child, .gesture-hint i { display: none; }
  .zoom-controls { right: 12px; }
  .zoom-controls button { width: 40px; height: 40px; border-radius: 13px; }
  .audio-control { right: 12px; top: max(66px, calc(env(safe-area-inset-top) + 54px)); }
  .audio-control button { width: 48px; height: 48px; border-radius: 15px; }
  .audio-control button > span { font-size: 19px; }
  .view-status { display: none; }
  .control-dock { bottom: max(10px, env(safe-area-inset-bottom)); width: calc(100vw - 20px); padding: 7px 8px; gap: 2px 5px; border-radius: 22px; flex-wrap: wrap; justify-content: center; }
  .dock-group { gap: 2px; }
  .group-label { display: none; }
  .dock-divider { display: none; }
  .dock-button { min-width: 48px; min-height: 52px; padding-inline: 5px; border-radius: 15px; }
  .dock-button > span { font-size: 19px; }
  .weather-group { padding-right: 4px; }
}
@media (max-width: 420px) {
  .brand span:not(.brand-mark) { display: none; }
  .scene-index { display: none; }
  .zoom-controls { top: 42%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

  <body>
    <main class="viewer" id="viewer" data-time="day" data-weather="clear">
      <canvas id="sceneCanvas" aria-label="Interactive 3D miniature of Moon Mart. Drag to rotate and scroll or pinch to zoom."></canvas>
      <div class="snow-overlay" id="snowOverlay" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand" aria-label="Moon Mart Interactive Miniature">
          <span class="brand-mark" aria-hidden="true">☾</span>
          <div>
            <strong>MOON MART</strong>
            <span>INTERACTIVE MINIATURE</span>
          </div>
        </div>
        <div class="gesture-hint" id="gestureHint">
          <span class="drag-icon" aria-hidden="true">↔</span>
          <b>DRAG TO ROTATE</b>
          <i aria-hidden="true"></i>
          <span>SCROLL OR PINCH TO ZOOM</span>
        </div>
        <div class="scene-index"><span>SCENE</span><b>01</b></div>
      </header>

      <div class="zoom-controls" aria-label="Zoom controls">
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
      </div>

      <div class="audio-control">
        <button id="musicButton" type="button" aria-label="Play ambient music" aria-pressed="false">
          <span aria-hidden="true">♪</span>
          <small>MUSIC</small>
        </button>
      </div>

      <div class="view-status" id="viewStatus" aria-live="polite">DAY · CLEAR</div>

      <section class="control-dock" aria-label="Scene controls">
        <div class="dock-group" aria-label="Time of day">
          <span class="group-label">TIME</span>
          <button type="button" class="dock-button active" data-time-value="day" aria-label="Day" aria-pressed="true"><span aria-hidden="true">☀</span><small>DAY</small></button>
          <button type="button" class="dock-button" data-time-value="dusk" aria-label="Dusk" aria-pressed="false"><span aria-hidden="true">◐</span><small>DUSK</small></button>
          <button type="button" class="dock-button" data-time-value="night" aria-label="Night" aria-pressed="false"><span aria-hidden="true">☾</span><small>NIGHT</small></button>
        </div>
        <div class="dock-divider" aria-hidden="true"></div>
        <div class="dock-group" aria-label="View options">
          <span class="group-label">VIEW</span>
          <button type="button" class="dock-button" id="roofButton" aria-label="Open roof" aria-pressed="false"><span aria-hidden="true">◇</span><small>ROOF</small></button>
          <button type="button" class="dock-button" id="autoButton" aria-label="Start auto rotation" aria-pressed="false"><span aria-hidden="true">↻</span><small>AUTO</small></button>
          <button type="button" class="dock-button" id="resetButton" aria-label="Reset view"><span aria-hidden="true">⌂</span><small>RESET</small></button>
        </div>
        <div class="dock-divider" aria-hidden="true"></div>
        <div class="dock-group weather-group" aria-label="Weather">
          <span class="group-label">WEATHER</span>
          <button type="button" class="dock-button active" data-weather-value="clear" aria-label="Clear weather" aria-pressed="true"><span aria-hidden="true">☀</span><small>CLEAR</small></button>
          <button type="button" class="dock-button" data-weather-value="cloudy" aria-label="Cloudy weather" aria-pressed="false"><span aria-hidden="true">☁</span><small>CLOUD</small></button>
          <button type="button" class="dock-button" data-weather-value="rain" aria-label="Rainy weather" aria-pressed="false"><span aria-hidden="true">☂</span><small>RAIN</small></button>
          <button type="button" class="dock-button" data-weather-value="snow" aria-label="Snowy weather" aria-pressed="false"><span aria-hidden="true">❄</span><small>SNOW</small></button>
        </div>
      </section>

      <div class="loading-layer" id="loadingLayer" role="status" aria-live="polite">
        <span class="loading-cube" aria-hidden="true"></span>
        <b>BUILDING THE MINIATURE</b>
      </div>
      <noscript>This interactive scene requires JavaScript.</noscript>
    </main>

document.querySelector("#zoomIn").addEventListener("click",()=>{camera.zoom=Math.min(controls.maxZoom,camera.zoom+.16);camera.updateProjectionMatrix();});document.querySelector("#zoomOut").addEventListener("click",()=>{camera.zoom=Math.max(controls.minZoom,camera.zoom-.16);camera.updateProjectionMatrix();});controls.addEventListener("start",()=>gestureHint.classList.add("used"));
function resize(){const width=window.innerWidth,height=window.innerHeight,aspect=width/height;if(aspect>=1){camera.left=-frustumSize*aspect/2;camera.right=frustumSize*aspect/2;camera.top=frustumSize/2;camera.bottom=-frustumSize/2;}else {camera.left=-frustumSize/2;camera.right=frustumSize/2;camera.top=frustumSize/aspect/2;camera.bottom=-frustumSize/aspect/2;}camera.updateProjectionMatrix();renderer.setSize(width,height,false);}window.addEventListener("resize",resize,{passive:true});resize();
const clock=new uu();function fall(attribute,speed,spreadX,top=14){const arr=attribute.array;for(let i=0;i<arr.length;i+=3){arr[i+1]-=speed;if(arr[i+1]<-0.8){arr[i+1]=top+Math.random()*2;arr[i]=(Math.random()-.5)*spreadX;}}attribute.needsUpdate=true;}
function animate(){const dt=Math.min(clock.getDelta(),.035);const now=performance.now()*.001;controls.update();if(cloudField.visible){cloudField.children.forEach((cloud)=>{cloud.position.x+=cloud.userData.drift*dt;if(cloud.position.x>9.5)cloud.position.x=-9.5;cloud.position.y=cloud.userData.baseY+Math.sin(now*.35+cloud.userData.phase)*.12;});}if(petals.visible){const attr=petalGeometry.attributes.position;const arr=attr.array;for(let i=0;i<arr.length;i+=3){arr[i]+=(Math.sin(now+i)*.12)*dt;arr[i+1]-=.38*dt;if(arr[i+1]<.1){arr[i+1]=7+Math.random()*2;arr[i]=(Math.random()-.5)*10;}}attr.needsUpdate=true;petals.rotation.y+=dt*.012;}if(snow.visible){const attr=snowGeometry.attributes.position;const arr=attr.array;for(let i=0;i<arr.length;i+=3)arr[i]+=(Math.sin(now*1.5+i*.7)*.38+.13)*dt;fall(attr,1.65*dt,22,14);}if(snowFront.visible){const attr=snowFrontGeometry.attributes.position;const arr=attr.array;for(let i=0;i<arr.length;i+=3)arr[i]+=(Math.sin(now*1.8+i*.55)*.52+.18)*dt;fall(attr,2.05*dt,24,15);}if(rain.visible){const attr=rainGeometry.attributes.position;const arr=attr.array;for(let i=0;i<arr.length;i+=6){arr[i+1]-=8.8*dt;arr[i+4]-=8.8*dt;if(arr[i+1]<0){const y=12+Math.random()*2;arr[i+1]=y;arr[i+4]=y-.42;}}attr.needsUpdate=true;}renderer.render(scene,camera);requestAnimationFrame(animate);}
function registerWebMcp(){const context=document.modelContext;if(!context?.registerTool)return;const register=(tool)=>{try{void Promise.resolve(context.registerTool(tool)).catch((error)=>console.warn("WebMCP registration failed",error));}catch(error){console.warn("WebMCP registration failed",error);}};register({name:"set_moon_mart_atmosphere",title:"Set scene atmosphere",description:"Change the visible Moon Mart scene time and weather.",inputSchema:{type:"object",properties:{time:{type:"string",enum:["day","dusk","night"]},weather:{type:"string",enum:["clear","cloudy","rain","snow"]}},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:(input)=>setAtmosphere(input?.time??state.time,input?.weather??state.weather)});register({name:"set_moon_mart_view",title:"Set scene view",description:"Open or close the roof and enable or disable automatic 360-degree rotation.",inputSchema:{type:"object",properties:{roofOpen:{type:"boolean"},autoRotate:{type:"boolean"}},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:(input)=>setView(input??{})});register({name:"reset_moon_mart_camera",title:"Reset scene camera",description:"Return the visible 3D scene to its original isometric camera angle.",inputSchema:{type:"object",properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:()=>resetCamera()});}
setAtmosphere("day","clear");registerWebMcp();animate();requestAnimationFrame(()=>requestAnimationFrame(()=>{loadingLayer.classList.add("ready");setTimeout(()=>{loadingLayer.hidden=true;},650);}));})();</script>
